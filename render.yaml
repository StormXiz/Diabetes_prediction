# Blueprint de Render para desplegar la API con un clic.
# En el dashboard de Render: New + -> Blueprint -> conecta este repo -> Apply.
# Las variables marcadas "sync: false" las rellenas tú a mano en el dashboard
# (nunca van commiteadas al repo).
services:
  - type: web
    name: diabetes-risk-api
    runtime: python
    plan: free
    rootDir: Backend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
